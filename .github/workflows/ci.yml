name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Hang safety net, not a performance target. Measured on a Windows dev
    # machine: 781 tests in ~20 min (unittest 763 in ~20 min). The earlier
    # value of 15 with a comment claiming "~5-8 min" was stale and would have
    # killed the job on the clock. Linux runners are usually faster for this
    # subprocess-heavy suite; the margin is deliberately wide. A test hanging
    # on a real network call (see tests/__init__.py) still fails faster than
    # the runner limit.
    #
    # 781 is the measurement that set the 30 minutes, not a current count --
    # deliberately not overwritten, because "1131 tests in ~20 min" would be
    # a claim that was never measured. For the current state and the growth
    # analysis (TASK-123): C4-Documentation/c4-code-github-workflows.md §4.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile all Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Shell syntax check
        run: bash -n setup.sh scripts/doctor.sh

      # pytest, not `unittest discover`: the latter does not collect bare
      # module-level test_* functions, so 21 tests across six files never ran
      # -- including the doc guard in
      # tests/test_integration_documentation.py. See TASK-53.
      - name: Run test suite under coverage
        run: python3 -m coverage run -m pytest tests -q

      - name: Coverage report (gate + job summary)
        if: always()
        run: |
          python3 -m coverage report
          # --fail-under just below the locally measured baseline (77% total),
          # so a real coverage regression breaks the job but noise does not.
          python3 -m coverage report --fail-under=75
          {
            echo '### Coverage'
            echo ''
            echo '```'
            python3 -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Atlas ran entirely outside CI until TASK-91: neither the pytest sidecar
  # nor the vitest frontend was enforced, so every Atlas change shipped
  # unguarded. Separate job: own dependencies, own failure domain.
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sidecar dependencies
        run: pip install -r atlas/sidecar/requirements.txt pytest

      - name: Sidecar tests
        run: python3 -m pytest atlas/sidecar/tests -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: atlas/frontend/package-lock.json

      - name: Frontend install
        working-directory: atlas/frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: atlas/frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: atlas/frontend
        run: npx vitest run
